<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <style>
      .mono { font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, Menlo, Monaco, Consolas, monospace; font-size: 13px; fill: #cdd6f4; }
      .prompt { fill: #89b4fa; font-weight: bold; }
      .cmd { fill: #a6e3a1; font-weight: 600; }
      .flag { fill: #f9e2af; }
      .border { fill: #585b70; }
      .header { fill: #b4befe; font-weight: bold; }
      .success { fill: #a6e3a1; font-weight: bold; }
      .tag { fill: #fab387; }
      .meta { fill: #9399b2; }
      .highlight { fill: #cba6f7; }
      .cyan { fill: #89dceb; }
      .route-score { fill: #fab387; }
    </style>
  </defs>

  <!-- Window Container with Shadow -->
  <rect x="20" y="20" width="960" height="580" rx="12" fill="url(#bgGrad)" filter="url(#shadow)" stroke="#313244" stroke-width="1.5"/>

  <!-- Title Bar -->
  <rect x="20" y="20" width="960" height="42" rx="12" fill="#11111b"/>
  <rect x="20" y="50" width="960" height="12" fill="#11111b"/>
  <line x1="20" y1="62" x2="980" y2="62" stroke="#313244" stroke-width="1"/>

  <!-- Window Controls -->
  <circle cx="46" cy="41" r="6" fill="#f38ba8"/>
  <circle cx="68" cy="41" r="6" fill="#f9e2af"/>
  <circle cx="90" cy="41" r="6" fill="#a6e3a1"/>

  <!-- Window Title -->
  <text x="500" y="46" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#a6adc8">railfog — terminal experience — v0.9.2</text>

  <!-- Terminal Content Area -->
  <g transform="translate(50, 95)" class="mono">
    <!-- Step 1: Version check -->
    <text x="0" y="0">
      <tspan class="prompt">railfog@v8:~$ </tspan>
      <tspan class="cmd">rail --version</tspan>
    </text>
    <text x="0" y="22" class="meta">railfog v0.9.2 (deno-lts, x86_64-pc-windows-msvc) • Primitives: Compute • State • Data • Signal</text>

    <!-- Step 2: Init worked-example -->
    <text x="0" y="56">
      <tspan class="prompt">railfog@v8:~$ </tspan>
      <tspan class="cmd">rail init </tspan>
      <tspan class="tag">upload-pipeline </tspan>
      <tspan class="flag">--template worked-example</tspan>
    </text>

    <!-- Scaffolding Box -->
    <text x="0" y="84" class="border">┌── Project Scaffolding Complete ────────────────────────────────────────────────────────┐</text>
    <text x="0" y="104" class="border">│  <tspan class="header">Station:    </tspan><tspan class="highlight">upload-pipeline</tspan></text>
    <text x="0" y="124" class="border">│  <tspan class="header">Template:   </tspan><tspan class="cyan">Worked Example</tspan><tspan class="meta"> (Compute + State + Data + Signal)</tspan></text>
    <text x="0" y="144" class="border">│  <tspan class="header">Created:    </tspan><tspan class="meta">railfog.toml, functions/api.ts, functions/processor.ts, deno.json</tspan></text>
    <text x="0" y="164" class="border">│  <tspan class="header">Status:     </tspan><tspan class="success">[+] Initialized successfully</tspan></text>
    <text x="0" y="184" class="border">└────────────────────────────────────────────────────────────────────────────────────────┘</text>

    <!-- Step 3: Change directory & Check -->
    <text x="0" y="218">
      <tspan class="prompt">railfog@v8:~/upload-pipeline$ </tspan>
      <tspan class="cmd">rail check</tspan>
    </text>

    <text x="0" y="244" class="header">Route Specificity Summary (PLAT-11):</text>
    <text x="0" y="264" class="meta">  SCORE  ROUTE PATTERN                  FUNCTION       CAPABILITIES</text>
    <text x="0" y="284" class="meta">  -----  -----------------------------  -------------  ------------------------------</text>
    <text x="0" y="304">  <tspan class="route-score">    2  </tspan><tspan class="cyan">/upload                       </tspan><tspan class="tag">api            </tspan><tspan class="meta">[data:uploads, signal:jobs]</tspan></text>
    <text x="0" y="324">  <tspan class="route-score">    -  </tspan><tspan class="cyan">queue:app:jobs                </tspan><tspan class="tag">processor      </tspan><tspan class="meta">[state:files, data:uploads]</tspan></text>

    <text x="0" y="356" class="success">[+] Configuration valid. Zero errors found. All capability bindings verified.</text>

    <!-- Step 4: Dev Server -->
    <text x="0" y="390">
      <tspan class="prompt">railfog@v8:~/upload-pipeline$ </tspan>
      <tspan class="cmd">rail dev </tspan>
      <tspan class="flag">--port 8000</tspan>
    </text>

    <text x="0" y="416" class="cyan">⚡ RailFog Local Runtime v0.9.2 listening on http://localhost:8000</text>
    <text x="0" y="436" class="meta">   ↳ Bound Primitives: State (SQLite V8) • Data (LocalFS) • Signal (Memory In-Process)</text>
    <text x="0" y="456">   <tspan class="success">POST</tspan> <tspan class="cyan">/upload</tspan> <tspan class="meta">→ api.ts: Presigned URL generated, emitted job signal to processor.ts (1.4ms)</tspan></text>
  </g>
</svg>
