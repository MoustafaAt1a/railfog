name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  verify:
    name: Code Quality & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno 2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Verify Code Formatting
        run: deno fmt --check

      - name: Lint Workspace
        run: deno lint

      - name: Full Typecheck (deno task check)
        run: deno task check

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno 2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Run Unit Tests
        run: deno task test:unit

      - name: Run Contract Tests
        run: deno task test:contract

      - name: Run Security Tests
        run: deno task test:security

      - name: Run Integration Tests
        run: deno task test:integration

  compile-check:
    name: Cross-Platform Binary Compilation
    runs-on: ${{ matrix.os }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            output: rail-linux-x86_64
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            output: rail-linux-aarch64
          - os: macos-latest
            target: aarch64-apple-darwin
            output: rail-darwin-aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            output: rail-windows-x86_64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Deno 2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Compile CLI Binary (${{ matrix.target }})
        run: deno compile --allow-read --allow-write --allow-net --allow-run --allow-env --target ${{ matrix.target }} --output dist/${{ matrix.output }} cli/main.ts

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 7
